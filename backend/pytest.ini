# pytest configuration for the XLine backend regression gate (RELEASE-TEST-01).
# Landing target: backend/pytest.ini (next to conftest.py).
[pytest]

# Markers registered explicitly so an unknown marker fails loudly instead of
# being downgraded to a warning.
markers =
    manual_field: Real on-device or live-session action (rover movement, inkjet/pen output, live ROS bridge, live model session). Collected by CI for inventory only; never executed offline.

# Never share pytest cache with a parallel local/audit run; CI and local
# equivalent validation both pass -p no:cacheprovider explicitly as well.
addopts = -p no:cacheprovider

# Keep the offline suite hermetic: no random ordering dependency is required
# for this gate; tests must be self-contained.
testpaths = tests
